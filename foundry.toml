# Keep Solidity paths at the workspace root for the editor and Forge.

[profile.default]
src = 'packages/contracts/src'
test = 'packages/contracts/test'
script = 'packages/contracts/script'
out = '.forge-out'
cache_path = '.forge-cache'
libs = ["packages/contracts/lib"]
verbosity = 2
bytecode_hash = 'none'
solc_version = '0.8.15'
